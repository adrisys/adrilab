services:
  github-runner:
    build: .
    container_name: adrxlab-github-runner
    environment:
      - GITHUB_OWNER=adrisys
      - GITHUB_REPO=adrilab
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - RUNNER_NAME=adrxlab-terraform-runner
      - RUNNER_LABELS=self-hosted,terraform,ansible,proxmox,docker
    volumes:
      # Mount a directory for persistent runner data with proper permissions
      - ./runner-data:/home/runner/_work:rw
      # Mount the entire adrilab repo to make files available
      - /root/adrilab:/adrilab:ro
      # Mount SSH keys for Ansible (using root's SSH directory)
      - /root/.ssh:/home/runner/.ssh:ro
    restart: unless-stopped
    user: "1000:1000"  # Run as user ID 1000 (standard for runner user)
