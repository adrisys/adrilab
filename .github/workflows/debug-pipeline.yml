name: 🐛 Debug Pipeline

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/debug-pipeline.yml']

jobs:
  debug:
    name: 🐛 Debug Environment
    runs-on: [self-hosted]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Environment Debug
        run: |
          echo "=== ENVIRONMENT DEBUG ==="
          echo "Current directory: $(pwd)"
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo ""
          echo "=== DIRECTORY STRUCTURE ==="
          ls -la
          echo ""
          echo "=== TERRAFORM CHECK ==="
          which terraform || echo "Terraform not in PATH"
          terraform version || echo "Terraform version failed"
          echo ""
          echo "=== MOUNTED FILES CHECK ==="
          echo "Checking /adrilab/terraform/terraform.tfvars:"
          ls -la /adrilab/terraform/terraform.tfvars 2>/dev/null || echo "Not found"
          echo ""
          echo "Checking terraform directory in checkout:"
          ls -la terraform/ 2>/dev/null || echo "terraform/ not found in checkout"
          echo ""
          echo "=== TERRAFORM FILES IN CHECKOUT ==="
          if [ -d "terraform" ]; then
            ls -la terraform/
          else
            echo "No terraform directory in checkout"
          fi
