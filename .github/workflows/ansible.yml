name: ⚙️ Ansible Configuration

on:
  workflow_dispatch:
    inputs:
      target_group:
        description: 'Target host group (leave empty for all)'
        required: false
        default: 'all'
        type: string
      check_only:
        description: 'Run in check mode only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_SSH_PRIVATE_KEY_FILE: "/root/.ssh/id_adrilab"

jobs:
  validate:
    name: Validate Ansible
    runs-on: [self-hosted, ansible]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📁 Copy Local Configuration
        run: |
          # Copy the local hosts.yml from mounted volume
          if [ -f "/adrilab/ansible/inventory/hosts.yml" ]; then
            cp /adrilab/ansible/inventory/hosts.yml ./ansible/inventory/hosts.yml
            echo "✅ Copied local hosts.yml"
          else
            echo "⚠️ Local hosts.yml not found, using repository version"
          fi
      
      - name: Validate Syntax
        working-directory: ./ansible
        run: ansible-playbook --syntax-check playbooks/site.yml -i inventory/hosts.yml
      
      - name: Lint Playbooks
        working-directory: ./ansible
        run: ansible-lint playbooks/site.yml
        continue-on-error: true
      
      - name: Validate Inventory
        working-directory: ./ansible
        run: ansible-inventory -i inventory/hosts.yml --list > /dev/null

  deploy:
    name: Deploy Configuration
    runs-on: [self-hosted, ansible]
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📁 Copy Local Configuration
        run: |
          # Copy the local hosts.yml from mounted volume
          if [ -f "/adrilab/ansible/inventory/hosts.yml" ]; then
            cp /adrilab/ansible/inventory/hosts.yml ./ansible/inventory/hosts.yml
            echo "✅ Copied local hosts.yml"
          else
            echo "⚠️ Local hosts.yml not found, using repository version"
          fi
      
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          # Debug: Show current user and home directory
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          echo "Current working directory: $(pwd)"
          
          # Create SSH directory for both regular user and root
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # If running as root or need root access, also set up /root/.ssh
          if [ "$(whoami)" = "root" ] || [ -w "/root" ] 2>/dev/null; then
            echo "Setting up SSH keys for root user"
            sudo mkdir -p /root/.ssh
            sudo chmod 700 /root/.ssh
            echo "$SSH_PRIVATE_KEY" | sudo tee /root/.ssh/id_adrilab > /dev/null
            sudo chmod 600 /root/.ssh/id_adrilab
            echo "$SSH_PRIVATE_KEY" | sudo tee /root/.ssh/id_rsa > /dev/null
            sudo chmod 600 /root/.ssh/id_rsa
            
            # Create SSH config for root
            sudo tee /root/.ssh/config > /dev/null << EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              IdentitiesOnly yes
              IdentityFile /root/.ssh/id_adrilab
          EOF
            sudo chmod 600 /root/.ssh/config
            
            echo "Root SSH setup completed:"
            sudo ls -la /root/.ssh/
          else
            echo "Setting up SSH keys for current user"
          fi
          
          # Set up for current user as well
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_adrilab
          chmod 600 ~/.ssh/id_adrilab
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Create SSH config for current user
          cat > ~/.ssh/config << EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              IdentitiesOnly yes
              IdentityFile ~/.ssh/id_adrilab
          EOF
          chmod 600 ~/.ssh/config
          
          # Debug: Show SSH key files
          echo "Current user SSH setup:"
          ls -la ~/.ssh/
          
          # Test SSH key format
          echo "Testing SSH key format:"
          ssh-keygen -l -f ~/.ssh/id_adrilab || echo "Warning: SSH key format check failed"
          
          # Check if secret is properly set
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty or not set!"
            exit 1
          else
            echo "SSH_PRIVATE_KEY secret is set (length: ${#SSH_PRIVATE_KEY})"
          fi
          
          # Create symlinks for additional fallback paths
          if [ -f "/root/.ssh/id_adrilab" ]; then
            sudo ln -sf /root/.ssh/id_adrilab /root/.ssh/id_rsa 2>/dev/null || true
          fi
          
          # Verify final SSH key setup
          echo "=== Final SSH Key Verification ==="
          if [ -f "/root/.ssh/id_adrilab" ]; then
            echo "✅ /root/.ssh/id_adrilab exists"
            sudo ls -la /root/.ssh/id_adrilab
          else
            echo "❌ /root/.ssh/id_adrilab does NOT exist"
          fi
      
      - name: Test Connectivity
        working-directory: ./ansible
        env:
          TARGET_GROUP: ${{ github.event.inputs.target_group || 'all' }}
        run: |
          echo "=== SSH Debug Information ==="
          echo "Current user: $(whoami)"
          echo "SSH keys available:"
          ls -la ~/.ssh/ 2>/dev/null || echo "No ~/.ssh directory"
          sudo ls -la /root/.ssh/ 2>/dev/null || echo "No /root/.ssh directory"
          
          echo "=== Ansible Configuration ==="
          ansible --version
          echo "Ansible config:"
          ansible-config dump --only-changed 2>/dev/null || echo "No custom config"
          
          echo "=== Inventory Information ==="
          echo "Available hosts:"
          ansible-inventory -i inventory/hosts.yml --limit "$TARGET_GROUP" --list
          
          echo "=== Environment Variables ==="
          env | grep -i ansible || echo "No ANSIBLE environment variables set"
          
          echo "=== Testing connectivity to hosts ==="
          echo "Testing with ping module (verbose)..."
          # Try with explicit SSH key specification
          ansible all -i inventory/hosts.yml --limit "$TARGET_GROUP" \
            --private-key /root/.ssh/id_adrilab \
            -e ansible_ssh_private_key_file=/root/.ssh/id_adrilab \
            -m ping -vvv || echo "Ping test with explicit key failed"
          
          echo "Testing with default configuration..."
          ANSIBLE_SSH_ARGS="-vvv" ansible all -i inventory/hosts.yml --limit "$TARGET_GROUP" -m ping -vvv || echo "Ping test completed with errors"      
      - name: Run Ansible Playbook
        working-directory: ./ansible
        env:
          TARGET_GROUP: ${{ github.event.inputs.target_group || 'all' }}
          CHECK_MODE: ${{ github.event.inputs.check_only == 'true' }}
        run: |
          echo "Running playbook with the following parameters:"
          echo "Target Group: $TARGET_GROUP"
          echo "Check Mode: $CHECK_MODE"
          
          # Show inventory for debugging
          echo "Available hosts in inventory:"
          ansible-inventory -i inventory/hosts.yml --list --yaml
          
          if [ "$CHECK_MODE" = "true" ]; then
            echo "Running in check mode..."
            ansible-playbook playbooks/site.yml -i inventory/hosts.yml --limit "$TARGET_GROUP" --check --diff -v
          else
            echo "Running in deploy mode..."
            ansible-playbook playbooks/site.yml -i inventory/hosts.yml --limit "$TARGET_GROUP" -v
          fi
      
      - name: Create Summary
        if: always()
        run: |
          echo "## Ansible Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ github.event.inputs.target_group || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ github.event.inputs.check_only == 'true' && 'Check' || 'Deploy' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Troubleshooting Tips" >> $GITHUB_STEP_SUMMARY
            echo "- Verify SSH key is correctly configured in secrets" >> $GITHUB_STEP_SUMMARY
            echo "- Check if target hosts are reachable from runner" >> $GITHUB_STEP_SUMMARY
            echo "- Ensure SSH key matches the one on target hosts" >> $GITHUB_STEP_SUMMARY
            echo "- Verify inventory configuration is correct" >> $GITHUB_STEP_SUMMARY
          fi
