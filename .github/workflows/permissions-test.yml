name: 🔧 Permissions Test

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/permissions-test.yml']

jobs:
  test:
    name: 🔧 Test Permissions Fix
    runs-on: [self-hosted]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ✅ Verify Checkout Success
        run: |
          echo "🎉 Checkout successful!"
          echo "Current directory: $(pwd)"
          echo "Files in checkout:"
          ls -la
          
      - name: 📁 Check Terraform Files
        run: |
          echo "Terraform files:"
          ls -la terraform/ | head -5
          
      - name: 📁 Copy Local terraform.tfvars
        run: |
          if [ -f "/adrilab/terraform/terraform.tfvars" ]; then
            cp /adrilab/terraform/terraform.tfvars terraform/terraform.tfvars
            echo "✅ Successfully copied local terraform.tfvars"
          else
            echo "❌ Local terraform.tfvars not found"
          fi
          
      - name: 🧪 Test Terraform
        working-directory: terraform
        run: |
          terraform version
          echo "✅ Terraform is working"
          
      - name: 🎉 Success Summary
        run: |
          echo "## 🎉 Permissions Fixed Successfully!"
          echo ""
          echo "✅ Checkout: Working"
          echo "✅ File operations: Working" 
          echo "✅ Terraform: Available"
          echo "✅ Local configs: Accessible"
          echo ""
          echo "🚀 Ready to run full Terraform pipeline!"
