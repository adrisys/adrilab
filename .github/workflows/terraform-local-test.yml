name: 🏗️ Terraform Local Test

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/terraform-local-test.yml']

env:
  TF_VERSION: "1.12.1"
  WORKING_DIR: ./terraform

jobs:
  terraform-local:
    name: 🏗️ Terraform Local Test
    runs-on: [self-hosted, terraform]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📁 Copy Local Configuration
        run: |
          echo "📋 Copying local terraform.tfvars..."
          if [ -f "/adrilab/terraform/terraform.tfvars" ]; then
            cp /adrilab/terraform/terraform.tfvars ${{ env.WORKING_DIR }}/terraform.tfvars
            echo "✅ Successfully copied local terraform.tfvars"
            echo ""
            echo "📋 Local configuration preview:"
            head -5 ${{ env.WORKING_DIR }}/terraform.tfvars
          else
            echo "❌ Local terraform.tfvars not found"
            exit 1
          fi

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 📋 Show Terraform Configuration
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "## 🏗️ Terraform Infrastructure Configuration"
          echo ""
          terraform version
          echo ""
          echo "📁 Terraform files:"
          ls -la *.tf *.tfvars
          echo ""
          echo "📋 Target infrastructure from terraform.tfvars:"
          grep -E "target_node|clone_template|cores|memory|ip_base" terraform.tfvars || true

      - name: 🎨 Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🎨 Checking Terraform formatting..."
          terraform fmt -check -recursive || {
            echo "⚠️ Some files need formatting, but continuing..."
            terraform fmt -recursive
            echo "✅ Files formatted automatically"
          }

      - name: ✅ Validate Configuration (Local Mode)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "✅ Validating Terraform configuration..."
          # Validate without backend initialization for testing
          terraform validate -backend=false
          echo "✅ Terraform configuration is valid!"

      - name: 📊 Infrastructure Summary
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "## 🚀 Infrastructure Summary"
          echo ""
          echo "**Configuration Status:** ✅ Valid"
          echo "**Local tfvars:** ✅ Applied"
          echo "**Terraform Version:** $(terraform version -json | jq -r '.terraform_version')"
          echo ""
          echo "### 📋 Planned Infrastructure:"
          echo "- **Proxmox Node:** $(grep 'target_node' terraform.tfvars | cut -d'=' -f2 | tr -d ' "' || echo 'Not specified')"
          echo "- **VM Template:** $(grep 'clone_template.*=' terraform.tfvars | head -1 | cut -d'=' -f2 | tr -d ' "' || echo 'Not specified')"
          echo "- **Resources:** $(grep 'cores.*=' terraform.tfvars | cut -d'=' -f2 | tr -d ' ') cores, $(grep 'memory.*=' terraform.tfvars | cut -d'=' -f2 | tr -d ' ')MB RAM"
          echo "- **Network:** $(grep 'ip_base' terraform.tfvars | cut -d'=' -f2 | tr -d ' "' || echo 'Not specified').x/$(grep 'ip_netmask' terraform.tfvars | cut -d'=' -f2 | tr -d ' "' || echo '24')"
          echo ""
          echo "🎉 **Terraform pipeline test completed successfully!**"
          echo "🔧 **Ready for full deployment with proper AWS/Proxmox credentials**"
