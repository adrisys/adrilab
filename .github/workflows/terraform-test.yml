name: 🧪 Terraform Test Pipeline

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/terraform-test.yml']

permissions:
  contents: read

env:
  TF_VERSION: "1.12.1"
  WORKING_DIR: ./terraform

jobs:
  terraform-test:
    name: 🧪 Test Terraform Setup
    runs-on: [self-hosted, terraform]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📁 Copy Local Configuration
        run: |
          # Copy the local terraform.tfvars from mounted volume
          if [ -f "/adrilab/terraform/terraform.tfvars" ]; then
            cp /adrilab/terraform/terraform.tfvars ${{ env.WORKING_DIR }}/terraform.tfvars
            echo "✅ Copied local terraform.tfvars"
            echo "📋 Contents preview:"
            head -10 ${{ env.WORKING_DIR }}/terraform.tfvars
          else
            echo "⚠️ Local terraform.tfvars not found"
          fi

      - name: 🔧 Check Terraform Installation
        run: |
          terraform version
          echo "✅ Terraform is available"

      - name: 📁 List Terraform Files
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "📋 Terraform files in directory:"
          ls -la *.tf *.tfvars 2>/dev/null || echo "No .tf files found"

      - name: 🎨 Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform fmt -check -recursive || echo "⚠️ Some files need formatting"
          echo "✅ Format check completed"

      - name: ✅ Validate Syntax (without init)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Just validate syntax without backend initialization
          terraform validate -backend=false || echo "⚠️ Validation issues found"
          echo "✅ Syntax validation completed"

      - name: 📊 Show Configuration Summary
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "## 🏗️ Infrastructure Configuration Summary"
          echo ""
          echo "**Terraform Version:** $(terraform version -json | jq -r '.terraform_version')"
          echo "**Configuration Files:**"
          ls -la *.tf *.tfvars 2>/dev/null | awk '{print "- " $9 " (" $5 " bytes)"}'
          echo ""
          echo "**Local terraform.tfvars configured:** $([ -f terraform.tfvars ] && echo 'Yes ✅' || echo 'No ❌')"
          echo ""
          echo "🎉 Test pipeline completed successfully!"
