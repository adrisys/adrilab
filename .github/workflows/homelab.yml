name: Homelab Infrastructure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -var-file=/home/runner/terraform.tfvars

      # Only apply on main branch pushes
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -var-file=/home/runner/terraform.tfvars -auto-approve

  ansible:
    runs-on: self-hosted
    needs: terraform  # Wait for infrastructure to be ready
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/site.yml -i /home/runner/hosts.yml

      - name: Test connectivity
        working-directory: ansible
        run: ansible all -i /home/runner/hosts.yml -m ping

      - name: Run Ansible playbook (dry run)
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml -i /home/runner/hosts.yml --check

      # Only deploy on main branch pushes
      - name: Deploy with Ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml -i /home/runner/hosts.yml
