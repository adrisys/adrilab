# Prometheus Stack Values Configuration
# Custom values for kube-prometheus-stack Helm chart

# Global settings
global:
  rbac:
    create: true

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path  # Adjust based on your storage class
          resources:
            requests:
              storage: 20Gi
    
    # Retention period
    retention: 30d
    retentionSize: 15GB
    
    # Resource limits
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 500m
        memory: 2Gi
    
    # Additional scrape configs
    additionalScrapeConfigs: []
    
    # Service monitor selector
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
  # Service configuration
  service:
    type: NodePort
    nodePort: 30090

# Grafana configuration
grafana:
  # Admin credentials
  adminPassword: "secure-admin-password"  # Change this!
  
  # Persistence
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
    
  # Service configuration
  service:
    type: NodePort
    nodePort: 30080
    
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
      
  # Grafana configuration
  grafana.ini:
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true

  # Default dashboards
  defaultDashboardsEnabled: true
  
  # Additional dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      # Node Exporter Dashboard
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
      
      # Kubernetes Cluster Monitoring
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      
      # Kubernetes Pod Monitoring
      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi
    
    # Resource limits
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
        
  # Service configuration
  service:
    type: NodePort
    nodePort: 30093

# Node Exporter (collects node metrics)
nodeExporter:
  enabled: true
  
# Kube State Metrics (collects Kubernetes metrics)
kubeStateMetrics:
  enabled: true

# Prometheus Operator
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi

# Additional ServiceMonitors for common applications
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: true

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true
