# Inventory for 1 control plane and 2 worker nodes cluster
# Replace the IP addresses and hostnames with your actual server details

[kube_control_plane]
# Single control plane node
master ansible_host=10.0.50.50 ip=10.0.50.50 etcd_member_name=etcd1

[etcd:children]
# etcd runs on the same node as control plane (stacked topology)
kube_control_plane

[kube_node]
# Two worker nodes
worker1 ansible_host=10.0.50.52 ip=10.0.50.52
worker2 ansible_host=10.0.50.53 ip=10.0.50.53

[calico_rr]
# Calico route reflector (optional, can be empty for small clusters)

[k8s_cluster:children]
kube_control_plane
kube_node
calico_rr

[all:vars]
# Global SSH settings
ansible_user=user
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
