name: ⚙️ Ansible Configuration

on:
  workflow_dispatch:
    inputs:
      target_group:
        description: 'Target host group (leave empty for all)'
        required: false
        default: 'all'
        type: string
      check_only:
        description: 'Run in check mode only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_SSH_PRIVATE_KEY_FILE: "/root/.ssh/id_adrilab"
  ANSIBLE_DISPLAY_SKIPPED_HOSTS: "False"
  ANSIBLE_DISPLAY_OK_HOSTS: "False"

jobs:
  validate:
    name: Validate Ansible
    runs-on: [self-hosted, ansible]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📁 Copy Local Configuration
        run: |
          if [ -f "/adrilab/ansible/inventory/hosts.yml" ]; then
            cp /adrilab/ansible/inventory/hosts.yml ./ansible/inventory/hosts.yml
          fi
      
      - name: Validate Syntax
        working-directory: ./ansible
        run: |
          echo "Validating playbook syntax..."
          ansible-playbook --syntax-check playbooks/site.yml -i inventory/hosts.yml 2>&1 | \
          sed -E 's/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/<IP-REDACTED>/g' | \
          sed -E 's/([a-zA-Z0-9-]+\.(local|lan|internal|home))/<HOST-REDACTED>/g'
          echo "✓ Syntax validation complete"
      
      - name: Lint Playbooks
        working-directory: ./ansible
        run: |
          echo "Running playbook linting..."
          ansible-lint playbooks/site.yml 2>&1 | \
          sed -E 's/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/<IP-REDACTED>/g' | \
          sed -E 's/([a-zA-Z0-9-]+\.(local|lan|internal|home))/<HOST-REDACTED>/g' || true
          echo "✓ Linting complete"
        continue-on-error: true
      
      - name: Validate Inventory
        working-directory: ./ansible
        run: |
          echo "Validating inventory structure..."
          ansible-inventory -i inventory/hosts.yml --list | jq 'del(.._meta.hostvars) | walk(if type == "object" and has("hosts") then .hosts = ["<redacted>"] else . end)' > /dev/null
          echo "✓ Inventory validation complete"

  deploy:
    name: Deploy Configuration
    runs-on: [self-hosted, ansible]
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📁 Copy Local Configuration
        run: |
          if [ -f "/adrilab/ansible/inventory/hosts.yml" ]; then
            cp /adrilab/ansible/inventory/hosts.yml ./ansible/inventory/hosts.yml
          fi
      
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          echo "Setting up SSH configuration..."
          mkdir -p ~/.ssh
          sudo mkdir -p /root/.ssh
          chmod 700 ~/.ssh
          sudo chmod 700 /root/.ssh
          
          echo "$SSH_PRIVATE_KEY" | sudo tee /root/.ssh/id_adrilab > /dev/null
          sudo chmod 600 /root/.ssh/id_adrilab
          echo "$SSH_PRIVATE_KEY" | sudo tee /root/.ssh/id_rsa > /dev/null
          sudo chmod 600 /root/.ssh/id_rsa
          
          sudo tee /root/.ssh/config > /dev/null << EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              IdentitiesOnly yes
              IdentityFile /root/.ssh/id_adrilab
              LogLevel ERROR
          EOF
          sudo chmod 600 /root/.ssh/config
          
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_adrilab
          chmod 600 ~/.ssh/id_adrilab
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat > ~/.ssh/config << EOF
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              IdentitiesOnly yes
              IdentityFile ~/.ssh/id_adrilab
              LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          echo "✓ SSH configuration complete"   
      - name: Run Ansible Playbook
        working-directory: ./ansible
        env:
          TARGET_GROUP: ${{ github.event.inputs.target_group || 'all' }}
          CHECK_MODE: ${{ github.event.inputs.check_only == 'true' }}
          ANSIBLE_STDOUT_CALLBACK: minimal
        run: |
          if [ "$CHECK_MODE" = "true" ]; then
            ansible-playbook playbooks/site.yml -i inventory/hosts.yml --limit "$TARGET_GROUP" --check --diff 2>&1 | \
            sed -E 's/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/<IP-REDACTED>/g' | \
            sed -E 's/([a-zA-Z0-9-]+\.(local|lan|internal|home))/<HOST-REDACTED>/g'
          else
            ansible-playbook playbooks/site.yml -i inventory/hosts.yml --limit "$TARGET_GROUP" 2>&1 | \
            sed -E 's/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/<IP-REDACTED>/g' | \
            sed -E 's/([a-zA-Z0-9-]+\.(local|lan|internal|home))/<HOST-REDACTED>/g'
          fi
      
      - name: Create Summary
        if: always()
        run: |
          echo "## Ansible Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ github.event.inputs.target_group || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ github.event.inputs.check_only == 'true' && 'Check' || 'Deploy' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
